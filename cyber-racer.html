.o{display:flex;align-items:center;gap:8px;font-size:clamp(13px,2.2vw,16px);margin:5px 0}
.o b{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#111}
.steer{position:fixed;bottom:22px;width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);backdrop-filter:blur(6px);font-size:36px;color:#fff;display:none;touch-action:none}
#L{left:18px}#R{right:18px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(4,6,16,.55);backdrop-filter:blur(3px)}
#ov.h{display:none}

.card p{color:#b8c6dc;margin:8px 0;font-size:.95rem;line-height:1.45}
.big{font-size:3.4rem;margin:4px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font-size:1.05rem;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#5eead4,#818cf8);color:#08122a}
.btn.alt{background:linear-gradient(90deg,#fbbf24,#fb7185);color:#2a1200}
.btn.g{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{margin:0}.row .btn.sel{outline:3px solid #5eead4}
input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;text-align:center;font-size:1rem;margin-top:10px}

    ctx.fillStyle=lg(0,-1.9*u,0,-1.3*u,[body[0],body[1]]);rr(-1.15*u,-1.9*u,2.3*u,.62*u,.26*u);ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-1.85*u);ctx.lineTo(0,-1.3*u);ctx.stroke();
    ctx.fillStyle=lg(0,-2.55*u,0,-1.85*u,["#86a8dd","#1a2744","#070a14"]);rr(-.94*u,-2.55*u,1.88*u,.82*u,.38*u);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.22)";ctx.beginPath();ctx.moveTo(-.62*u,-2.47*u);ctx.lineTo(-.15*u,-2.47*u);ctx.lineTo(-.46*u,-1.82*u);ctx.lineTo(-.82*u,-1.82*u);ctx.fill();
    ctx.fillStyle=lg(0,-2.66*u,0,-2.46*u,[body[0],body[1]]);rr(-.86*u,-2.66*u,1.72*u,.18*u,.09*u);ctx.fill();
    [-1,1].forEach(d=>{ctx.fillStyle=body[1];rr(d*1.1*u-.13*u,-2.02*u,.26*u,.19*u,.07*u);ctx.fill()});
    ctx.fillStyle="#0b0c10";ctx.fillRect(-.72*u,-2.1*u,.08*u,.28*u);ctx.fillRect(.64*u,-2.1*u,.08*u,.28*u);rr(-1.28*u,-2.24*u,2.56*u,.14*u,.05*u);ctx.fill();ctx.fillRect(-1.28*u,-2.3*u,.06*u,.24*u);ctx.fillRect(1.22*u,-2.3*u,.06*u,.24*u);
    glow(-1.16*u,-1.26*u,.86*u,.2*u,.08*u);glow(.3*u,-1.26*u,.86*u,.2*u,.08*u);glow(-.3*u,-1.2*u,.6*u,.07*u,.03*u);glow(-.3*u,-1.76*u,.6*u,.06*u,.03*u);
    ctx.fillStyle="#f4f4f4";rr(-.33*u,-1.0*u,.66*u,.23*u,.03*u);ctx.fill();ctx.fillStyle="#111";ctx.font="700 "+(.13*u)+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("CY-5EC",0,-.88*u);
  }
  ctx.restore();
}
function drawFx(){
  S.parts=S.parts.filter(p=>p.l>0);S.parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l*1.5);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*1.4);ctx.globalAlpha=1});
  const g=ctx.createRadialGradient(cx,H*.55,Math.min(W,H)*.35,cx,H*.55,Math.max(W,H)*.8);g.addColorStop(0,"transparent");g.addColorStop(1,"rgba(0,0,10,.55)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(S.spd>5.2){ctx.strokeStyle="rgba(255,255,255,.18)";ctx.lineWidth=2;for(let i=0;i<12;i++){const a=(i/12)*6.28+S.t,r1=Math.min(W,H)*.4,r2=r1+40+S.spd*4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1*1.3,hz+Math.sin(a)*r1*.5+H*.2);ctx.lineTo(cx+Math.cos(a)*r2*1.3,hz+Math.sin(a)*r2*.5+H*.2);ctx.stroke()}}
}
function burst(good){const x=laneX(S.px,1),n=good?46:26;for(let i=0;i<n;i++)S.parts.push({x,y:by-30,vx:(Math.random()-.5)*380,vy:-Math.random()*420-80,l:1,s:4+Math.random()*5,c:good?["#5eead4","#ffd23f","#fff","#818cf8","#ff5c7a"][i%5]:["#ff3b5c","#ff9f43","#fff"][i%3]})}

/* ---------- game loop ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;S.t+=dt;
  const want=S.mode==="drive"?4.2+S.lvl*.5:S.mode==="menu"?4:2.5;S.spd+=(want-S.spd)*Math.min(1,dt*3);S.scroll+=S.spd*dt;
  S.px+=(S.target-S.px)*Math.min(1,dt*9);
  S.lampZ=S.lampZ.map(z=>{z-=S.spd*dt;return z<-6?z+72:z});
  if(S.mode==="drive"&&S.g){S.g.z-=S.spd*dt;if(S.g.z<=.1)resolve()}
  S.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.l-=dt*1.1});
  if(S.shake>0)S.shake-=dt;
  const T=th();ctx.save();if(S.shake>0)ctx.translate((Math.random()-.5)*14*S.shake*2,(Math.random()-.5)*14*S.shake*2);
  drawSky(T);drawRoad(T);
  const items=S.lampZ.map((z,i)=>({z,d:i%2?1:-1,lamp:1}));if(S.g)items.push({z:S.g.z,gate:1});
  items.sort((a,b)=>b.z-a.z).forEach(it=>it.gate?drawGate(S.g):drawLamp(it.z,it.d,T));
  drawVeh(T);drawFx();ctx.restore();requestAnimationFrame(loop);
}

/* ---------- flow ---------- */
function show(h){$('card').innerHTML=h;$('ov').classList.remove('h')}
function hide(){$('ov').classList.add('h')}
function menu(){S.mode="menu";S.g=null;$('hud').style.display="none";$('L').style.display=$('R').style.display="none";S.lvl=0;genCity();
  show(`<div class="big">🏍️🔐🏎️</div><h1>Cyber Racer</h1><p>5 levels. Race down the highway and steer into the lane with the <b>safe answer</b> to become a Cyber Champion!</p>
  <input id="nm" maxlength="18" placeholder="Type your name" value="${S.name}">
  <div class="row"><button class="btn ${S.veh==='bike'?'sel':''}" id="vb" onclick="veh('bike')">🏍️ Bike</button><button class="btn ${S.veh==='car'?'sel':''}" id="vc" onclick="veh('car')">🏎️ Car</button></div>
  <button class="btn" onclick="startGame()">Start Racing 🚀</button>`)}
function veh(v){S.veh=v;$('vb').classList.toggle('sel',v==='bike');$('vc').classList.toggle('sel',v==='car')}
function startGame(){S.name=($('nm').value||"Cyber Racer").trim();S.tot=0;S.st=0;S.lvl=0;intro()}
function intro(){S.mode="pause";S.g=null;genCity();$('hud').style.display="none";$('L').style.display=$('R').style.display="none";const T=th();
  show(`<div class="big">${T.e}</div><h2>Level ${S.lvl+1} of 5</h2><h1>${T.n}</h1><p>Topic: <b>${T.t}</b></p><p>4 gates ahead — no rush, the gates come slowly so you have time to read. Then steer ◀ ▶ (arrow keys, taps or swipe) into the lane with the right answer.</p><button class="btn" onclick="beginLevel()">Start engine 🏁</button>`)}
function beginLevel(){S.qi=0;S.lc=0;S.target=0;hide();$('hud').style.display="block";$('L').style.display=$('R').style.display="block";nextGate()}
function nextGate(){
  if(S.qi>=4){levelDone();return}
  const q=Q[S.lvl][S.qi],opts=shuffle(q[1].map((t,i)=>({t,ok:i===0})));S.g={z:75,opts,why:q[2]};S.mode="drive";
  $('lv').textContent=th().e+" Level "+(S.lvl+1)+"/5";$('qn').textContent="Gate "+(S.qi+1)+"/4";$('sc').textContent="⭐ "+S.tot;$('qt').textContent=q[0];
  $('qo').innerHTML=opts.map((o,i)=>`<div class="o"><b style="background:${LC[i]}">${LN[i]}</b><span>${o.t}</span></div>`).join("");
}
function resolve(){
  const ch=Math.max(-1,Math.min(1,Math.round(S.target)))+1,o=S.g.opts[ch],good=o.ok;S.mode="pause";burst(good);if(!good)S.shake=.5;
  if(good){S.lc++;S.tot++}$('sc').textContent="⭐ "+S.tot;
  const right=S.g.opts.find(x=>x.ok).t;
  show(`<div class="big">${good?"✅":"💥"}</div><h2>${good?"Correct! Nice driving!":"Oops! Not that lane"}</h2>${good?"":`<p>Right answer: <b>${right}</b></p>`}<p>${S.g.why}</p><button class="btn" onclick="hide();S.qi++;S.g=null;nextGate()">Keep driving ➜</button>`);
}
function levelDone(){
  S.mode="pause";S.g=null;const n=S.lc>=4?3:S.lc>=3?2:1;S.st+=n;$('hud').style.display="none";$('L').style.display=$('R').style.display="none";
  const last=S.lvl===4;
  show(`<div class="big">${th().e}</div><h2>Level ${S.lvl+1} complete!</h2><div class="stars">${"★".repeat(n)}<span style="opacity:.25">${"★".repeat(3-n)}</span></div><p>${S.lc} of 4 correct</p><button class="btn" onclick="${last?"finale()":"S.lvl++;intro()"}">${last?"See my badge 🏆":"Next level ➜"}</button>`);
}
function finale(){
  const rank=S.tot>=18?"Cyber Champion":S.tot>=13?"Road-ready Defender":"Rising Racer";
  show(`<div class="big">🏆</div><h1>${S.name}</h1><h2>${rank}</h2><p>${S.tot} / 20 correct · ${S.st} / 15 stars</p><button class="btn alt" onclick="badge()">⬇ Download my badge</button><button class="btn g" onclick="menu()">Race again</button>`);
}
function badge(){
  const c=document.createElement('canvas');c.width=800;c.height=1000;const x=c.getContext('2d');x.textAlign="center";
  const cx0=400,cy=340,R=260,rank=S.tot>=18?"Cyber Champion":S.tot>=13?"Road-ready Defender":"Rising Racer";
  const rg=x.createLinearGradient(cx0-R,cy-R,cx0+R,cy+R);rg.addColorStop(0,"#5EEAD4");rg.addColorStop(.5,"#818CF8");rg.addColorStop(1,"#FBBF24");
  x.save();x.shadowColor="rgba(94,234,212,.55)";x.shadowBlur=45;x.lineWidth=22;x.strokeStyle=rg;x.beginPath();x.arc(cx0,cy,R,0,7);x.stroke();x.restore();
  let g=x.createRadialGradient(cx0,cy-70,30,cx0,cy,R);g.addColorStop(0,"#1E2B44");g.addColorStop(1,"#0B1220");x.fillStyle=g;x.beginPath();x.arc(cx0,cy,R-16,0,7);x.fill();
  x.fillStyle="#89A0B8";x.font="600 20px sans-serif";x.fillText("C Y B E R   R A C E R",cx0,cy-145);
  x.font="150px sans-serif";x.fillText(S.tot>=16?"🏆":"🛡️",cx0,cy+45);
  x.font="bold 48px sans-serif";x.fillStyle="#5EEAD4";x.fillText(S.tot+" / 20",cx0,cy+130);
  x.font="600 18px sans-serif";x.fillStyle="#89A0B8";x.fillText("★ "+S.st+" / 15 STARS",cx0,cy+162);
  const pw=560,ph=94,px=cx0-pw/2,py=cy+R+55;
  x.save();x.shadowColor="rgba(0,0,0,.45)";x.shadowBlur=24;x.shadowOffsetY=10;x.fillStyle="#131C2B";rrx(x,px,py,pw,ph,26);x.fill();x.restore();
  x.lineWidth=3;x.strokeStyle=rg;rrx(x,px,py,pw,ph,26);x.stroke();
  x.font="bold 36px sans-serif";x.fillStyle="#EAF0F7";x.fillText(S.name,cx0,py+ph/2+13);
  x.font="22px sans-serif";x.fillStyle="#89A0B8";x.fillText(rank,cx0,py+ph+48);x.font="16px sans-serif";x.fillText(new Date().toLocaleDateString(),cx0,py+ph+78);
  const a=document.createElement('a');a.download="cyber-racer-"+S.name.replace(/[^a-z0-9]/gi,"_")+".png";a.href=c.toDataURL("image/png");a.click();
}
function rrx(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

/* ---------- controls ---------- */
const steer=d=>{if(S.mode==="drive")S.target=Math.max(-1,Math.min(1,Math.round(S.target)+d))};
addEventListener('keydown',e=>{if(e.key==="ArrowLeft"||e.key==="a")steer(-1);if(e.key==="ArrowRight"||e.key==="d")steer(1)});
$('L').addEventListener('pointerdown',e=>{e.preventDefault();steer(-1)});$('R').addEventListener('pointerdown',e=>{e.preventDefault();steer(1)});
let sx=null;cv.addEventListener('pointerdown',e=>{sx=e.clientX});
cv.addEventListener('pointerup',e=>{if(sx===null)return;const d=e.clientX-sx;if(Math.abs(d)>40)steer(d>0?1:-1);else steer(e.clientX<W/2?-1:1);sx=null});
menu();requestAnimationFrame(loop);
</script>
</body>
