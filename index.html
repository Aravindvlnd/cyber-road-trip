<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Road Trip by Cyber Security & Advanced Crimes</title>
<style>
:root{
  --bg:#0B1220; --panel:#131C2B; --panel2:#1B2740; --line:#2A3A54;
  --text:#EAF0F7; --muted:#89A0B8;
  --go:#5EEAD4; --warn:#FBBF24; --bad:#FB7185;
  --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
header{text-align:center;margin-bottom:16px;}
h1{font-size:2.1rem;margin:6px 0 2px;}
.tag{color:var(--muted);font-size:1.05rem;margin:0;}
.shields{display:flex;justify-content:center;gap:8px;margin:16px 0 26px;font-size:1.8rem;}
.shields span{opacity:0.25;transition:opacity .2s;}
.shields span.on{opacity:1;}

.road{position:relative;background:#2B3342;border-radius:20px;padding:46px 0;overflow:hidden;}
.road::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;
  background:repeating-linear-gradient(to bottom, #fff 0 30px, transparent 30px 56px);
  opacity:0.5;
}
.stop{position:relative;display:flex;align-items:center;min-height:150px;margin:0 24px;}
.stop.left{justify-content:flex-start;}
.stop.right{justify-content:flex-end;}
.node{
  width:96px;height:96px;border-radius:50%;background:var(--panel2);border:4px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;z-index:2;position:relative;
  cursor:default;transition:transform .2s, border-color .2s;
}
.node.current{border-color:var(--go);animation:pulse 1.4s infinite;cursor:pointer;}
.node.done{border-color:var(--go);background:rgba(94,234,212,0.15);}
.node.locked{opacity:0.4;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.label{
  font-size:0.98rem;color:var(--muted);max-width:150px;line-height:1.25;margin:0 14px;font-weight:600;
}
.stop.left .label{order:2;}
.car{
  position:absolute;font-size:3.4rem;left:50%;transform:translate(-50%,-50%);z-index:3;
  transition:top .45s ease;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5));
}

.overlay{
  position:fixed;inset:0;background:rgba(5,8,14,0.82);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:10;
}
.overlay.hidden{display:none;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:440px;width:100%;}
.modal .kicker{color:var(--go);font-size:0.8rem;font-weight:600;margin:0 0 6px;}
.modal h3{margin:0 0 14px;font-size:1.1rem;line-height:1.4;}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:10px;padding:12px 14px;margin-bottom:9px;font-size:0.92rem;cursor:pointer;}
.opt:hover{border-color:var(--go);}
.opt.right{border-color:var(--go);background:rgba(94,234,212,0.12);}
.opt.wrong{border-color:var(--bad);background:rgba(251,113,133,0.12);}
.why{font-size:0.87rem;color:var(--muted);margin-top:10px;}
button.next{
  margin-top:16px;background:var(--go);color:#08201C;border:none;border-radius:10px;
  padding:11px 18px;font-weight:600;font-size:0.92rem;cursor:pointer;width:100%;
}
.badge{text-align:center;}
.badge .score{font-size:2.4rem;color:var(--go);margin:8px 0;}
input#nm{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-align:center;margin:10px 0;}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 16px;cursor:pointer;width:100%;margin-top:8px;}
button.dl{background:var(--warn);color:#3A2600;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:0.92rem;cursor:pointer;width:100%;margin-top:10px;}
footer{text-align:center;color:var(--muted);font-size:0.78rem;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚗 Cyber Road Trip</h1>
    <p class="tag">Drive the highway. Every stop is a real online danger — pick right to earn a shield.</p>
  </header>
  <div class="shields" id="shields"></div>
  <div class="road" id="road"></div>
  <footer>No data leaves this page · Built for hands-on cyber awareness</footer>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const LEVELS = [
 {icon:"🔑", label:"Password Alley",
  q:"Which password would survive longest against a hacking tool?",
  opts:["P@ssw0rd!","correct-horse-battery-staple","Summer2024","qwerty123"],
  right:1, why:"Length beats cleverness. A long random phrase has way more combinations to guess than a short 'complex-looking' one."},
 {icon:"🎣", label:"Phishing Junction",
  q:"An email says 'Your account will be LOCKED in 10 minutes — click here to verify now!' What do you do?",
  opts:["Click fast, before it locks","Ignore the link, go to the real site directly to check","Reply with your password to be safe","Forward it to friends"],
  right:1, why:"Urgency + a link is the classic phishing trick. Real companies don't threaten a 10-minute deadline — go to the site yourself instead of clicking."},
 {icon:"🎭", label:"Social Engineering Stop",
  q:"Someone calls claiming to be 'IT Support' and asks for your password to 'fix an issue'. What's the move?",
  opts:["Give it, they said IT","Ask for their employee ID, then hang up and call IT back yourself","Give a fake password instead","Only give half of it"],
  right:1, why:"Real IT never needs your actual password. This is a classic pretext — verify independently, never over the same call."},
 {icon:"🧟", label:"Malware Crossing",
  q:"A friend sends 'free_robux_hack.exe' and says it's totally safe. You should...",
  opts:["Run it, friends wouldn't lie","Not run it — unknown .exe files from chats are a top malware source","Run it in a new browser tab","Rename it first, then run it"],
  right:1, why:"Executable files shared in chats/DMs are one of the most common ways malware spreads, even from a friend whose account may be hacked."},
 {icon:"📍", label:"Privacy Park",
  q:"You're posting about your trip. Which is safest to share publicly?",
  opts:["'On vacation until the 14th! Home empty, address is...'","A photo after you're back home, with no address or dates","Your full home address 'just in case someone wants to visit'","Real-time location tags all week"],
  right:1, why:"Announcing you're away, plus your address, tells anyone watching exactly when your home is empty. Post after the fact instead."},
 {icon:"☕", label:"Public Wi-Fi Café",
  q:"You're at a coffee shop on open Wi-Fi. What's safe to do?",
  opts:["Online banking and entering card numbers","Browsing news with a VPN or using mobile data instead for anything sensitive","Logging into your bank 'just this once'","Anything, Wi-Fi is Wi-Fi"],
  right:1, why:"Open Wi-Fi can be snooped on by anyone nearby. Save logins and payments for a trusted network, or use a VPN / your phone's data."},
 {icon:"🔐", label:"2FA Tunnel",
  q:"What does turning on two-factor authentication (2FA) actually protect you from?",
  opts:["Nothing extra, it's just annoying","A stolen password alone won't be enough to get into your account","Losing your phone","Slow internet"],
  right:1, why:"2FA means even if a hacker gets your password, they still need your phone or authenticator code to log in."},
 {icon:"🏁", label:"Firewall Finish", finish:true}
];

let idx = 0, score = 0;
const roadEl = document.getElementById('road');
const shieldsEl = document.getElementById('shields');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

function renderShields(){
  shieldsEl.innerHTML = LEVELS.slice(0,-1).map((_,i)=>"<span class='"+(i<score?'on':'')+"'>🛡️</span>").join("");
}

function renderRoad(){
  roadEl.innerHTML = "";
  LEVELS.forEach((lv,i)=>{
    const side = i%2===0 ? "left" : "right";
    const state = i<idx ? "done" : i===idx ? "current" : "locked";
    const row = document.createElement('div');
    row.className = "stop "+side;
    row.innerHTML =
      "<div class='node "+state+"' data-i='"+i+"'>"+(state==="done" ? "✅" : lv.icon)+"</div>" +
      "<div class='label'>"+lv.label+"</div>";
    roadEl.appendChild(row);
  });
  const car = document.createElement('div');
  car.className = "car";
  car.id = "car";
  car.textContent = "🚗";
  roadEl.appendChild(car);
  positionCar();
  const cur = roadEl.querySelector('.node.current');
  if(cur) cur.addEventListener('click', ()=>openLevel(idx));
}

function positionCar(){
  const rows = roadEl.querySelectorAll('.stop');
  const car = document.getElementById('car');
  if(!rows[idx] || !car) return;
  const roadTop = roadEl.getBoundingClientRect().top;
  const rowRect = rows[idx].getBoundingClientRect();
  car.style.top = (rowRect.top - roadTop + rowRect.height/2) + "px";
}

function openLevel(i){
  const lv = LEVELS[i];
  if(lv.finish){ showFinish(); return; }
  modal.innerHTML =
    "<p class='kicker'>"+lv.icon+" "+lv.label+"</p>" +
    "<h3>"+lv.q+"</h3>" +
    lv.opts.map((o,j)=>"<button class='opt' data-j='"+j+"'>"+o+"</button>").join("");
  overlay.classList.remove('hidden');
  modal.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>pick(lv, parseInt(btn.dataset.j)));
  });
}

function pick(lv, j){
  const btns = modal.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[lv.right].classList.add('right');
  if(j !== lv.right) btns[j].classList.add('wrong'); else score++;
  const why = document.createElement('p');
  why.className = "why";
  why.textContent = lv.why;
  modal.appendChild(why);
  const next = document.createElement('button');
  next.className = "next";
  next.textContent = "Drive to next stop";
  next.onclick = ()=>{ overlay.classList.add('hidden'); idx++; renderShields(); renderRoad(); };
  modal.appendChild(next);
}

function showFinish(){
  modal.innerHTML =
    "<div class='badge'>" +
    "<div style='font-size:2.2rem;'>🏆</div>" +
    "<h3>You made it through the Cyber Highway</h3>" +
    "<div class='score'>"+score+" / "+(LEVELS.length-1)+" shields</div>" +
    "<input id='nm' placeholder='Type your name for the badge'>" +
    "<p class='why' id='badgeLine'></p>" +
    "<button class='dl' onclick='downloadBadge()'>⬇ Download my badge</button>" +
    "<button class='ghost' onclick='restart()'>Drive again</button>" +
    "</div>";
  overlay.classList.remove('hidden');
  const line = score===LEVELS.length-1 ? "Perfect run — you spotted every trick on the road."
    : score>=5 ? "Great instincts. A couple of stops to revisit, but you're road-ready."
    : "Good first lap — the biggest wins: longer passwords, 2FA, and never trusting urgent links.";
  document.getElementById('badgeLine').textContent = line;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function downloadBadge(){
  const name = (document.getElementById('nm').value || "Cyber Explorer").trim();
  const total = LEVELS.length - 1;
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  ctx.textAlign = "center";

  const cx = 400, cy = 340, R = 260;
  const ringGrad = ctx.createLinearGradient(cx-R, cy-R, cx+R, cy+R);
  ringGrad.addColorStop(0, "#5EEAD4");
  ringGrad.addColorStop(0.5, "#818CF8");
  ringGrad.addColorStop(1, "#FBBF24");

  ctx.save();
  ctx.shadowColor = "rgba(94,234,212,0.55)";
  ctx.shadowBlur = 45;
  ctx.lineWidth = 22;
  ctx.strokeStyle = ringGrad;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  const innerGrad = ctx.createRadialGradient(cx, cy-70, 30, cx, cy, R);
  innerGrad.addColorStop(0, "#1E2B44");
  innerGrad.addColorStop(1, "#0B1220");
  ctx.beginPath(); ctx.arc(cx, cy, R-16, 0, Math.PI*2); ctx.fillStyle = innerGrad; ctx.fill();

  ctx.fillStyle = "#89A0B8";
  ctx.font = "600 20px sans-serif";
  ctx.fillText("C Y B E R   R O A D   T R I P", cx, cy-145);

  ctx.font = "150px sans-serif";
  ctx.fillText(score===total ? "🏆" : "🛡️", cx, cy+45);

  ctx.font = "bold 48px sans-serif";
  ctx.fillStyle = "#5EEAD4";
  ctx.fillText(score + " / " + total, cx, cy+130);

  ctx.font = "600 18px sans-serif";
  ctx.fillStyle = "#89A0B8";
  ctx.fillText("S H I E L D S   E A R N E D", cx, cy+162);

  const pillW = 560, pillH = 94, pillX = cx - pillW/2, pillY = cy + R + 55;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.45)";
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 10;
  roundRect(ctx, pillX, pillY, pillW, pillH, 26);
  ctx.fillStyle = "#131C2B";
  ctx.fill();
  ctx.restore();
  roundRect(ctx, pillX, pillY, pillW, pillH, 26);
  ctx.lineWidth = 3; ctx.strokeStyle = ringGrad; ctx.stroke();

  ctx.font = "bold 36px sans-serif";
  ctx.fillStyle = "#EAF0F7";
  ctx.fillText(name, cx, pillY + pillH/2 + 13);

  ctx.font = "20px sans-serif";
  ctx.fillStyle = "#89A0B8";
  const line = score===total ? "Perfect run — spotted every trick on the road."
    : score>=5 ? "Great instincts — road-ready cyber defender."
    : "Completed the course — a road-ready start.";
  ctx.fillText(line, cx, pillY + pillH + 48);
  ctx.font = "16px sans-serif";
  ctx.fillText(new Date().toLocaleDateString(), cx, pillY + pillH + 78);

  const link = document.createElement('a');
  link.download = "cyber-badge-" + name.replace(/[^a-z0-9]/gi,'_') + ".png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function restart(){
  idx = 0; score = 0;
  overlay.classList.add('hidden');
  renderShields(); renderRoad();
}

window.addEventListener('resize', positionCar);
renderShields();
renderRoad();
</script>
</body>
</html>
